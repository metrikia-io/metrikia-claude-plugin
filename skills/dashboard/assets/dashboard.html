<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>Metrikia</title>
<style>
:root{
  --ink:#0a0a0b;--ink2:#0e0e10;--surface:#111113;--raised:#16161a;--bone:#f4f3f0;
  --dim:#85858d;--dim2:#a9a9ad;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);--line3:rgba(255,255,255,.4);
  --acc:#00e599;--acc-hover:#0ff0a6;--acc-ink:#04120c;--teal:#00a7c5;--cut:#f43f5e;--watch:#f5b544;
  --meta:#4c8bf5;--google:#f5b544;--tiktok:#ff5a6e;--ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html{color-scheme:dark;background:var(--ink);scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--bone);font:400 15px/1.55 Switzer,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:22px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.mark{display:inline-flex;align-items:center;font-weight:700;font-size:18px;letter-spacing:-.02em;text-transform:uppercase}
.mark i{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:3px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{padding:9px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);border:1px solid transparent;border-radius:2px;transition:color .2s var(--ease),border-color .2s var(--ease)}
.tabs button:hover{color:var(--bone)}
.tabs button[aria-selected=true]{color:var(--bone);border-color:var(--line2);background:var(--surface)}

.hero{position:relative;overflow:clip;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.2px);background-size:22px 22px;mask-image:radial-gradient(80% 90% at 78% 10%,#000 0,transparent 72%)}
.hero::after{content:"";position:absolute;inset:-40% -10% auto auto;width:720px;height:720px;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 22%,transparent),transparent);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:clamp(28px,5vw,72px);align-items:center;padding-top:clamp(40px,7vh,84px);padding-bottom:clamp(36px,6vh,72px)}
.kicker{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2)}
.kicker b{color:var(--acc);font-weight:500}
h1{margin-top:18px;font-size:clamp(27px,4vw,50px);line-height:1.1;letter-spacing:-.028em;font-weight:600;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
h1 em.bad{color:var(--cut)}
.hero .lead{margin-top:18px;max-width:58ch;color:var(--dim2);font-size:clamp(15px,1.3vw,17px)}
.big{border:1px solid var(--line2);border-radius:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 7%,var(--ink2)),var(--ink2));padding:26px 26px 22px;position:relative}
.big::before{content:"";position:absolute;inset:-1px 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.lbl{font-size:12px;color:var(--dim2)}
.big .v{font-size:clamp(54px,7vw,84px);line-height:1;letter-spacing:-.04em;font-weight:600;margin:10px 0 12px}

.band{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--cut) 50%,transparent);background:color-mix(in srgb,var(--cut) 9%,var(--ink));border-radius:4px;padding:14px 16px;margin-top:22px}
.band.notice{border-color:var(--line2);background:var(--ink2);color:var(--dim2);font-size:13px}
.band svg{flex:none;margin-top:2px}

section{padding:clamp(44px,7vh,84px) 0;border-bottom:1px solid var(--line)}
.idx{display:flex;align-items:baseline;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.idx .n{font-size:12px;letter-spacing:.14em;color:var(--acc);font-weight:500}
.idx h2{font-size:clamp(21px,2.4vw,30px);letter-spacing:-.02em;font-weight:600;line-height:1.15}
.idx p{color:var(--dim2);font-size:14px;width:100%}

.grid{display:grid;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.grid>*{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.kpis .v{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:6px 0 8px;line-height:1.1}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim2)}
.delta svg{flex:none}
.delta{flex-wrap:wrap;row-gap:0}
.delta>span{white-space:nowrap}
.delta small{color:var(--dim);font-size:12px;white-space:nowrap}

.fig{cursor:help;border-radius:2px;transition:background .15s var(--ease)}
.fig:hover,.fig:focus-visible{background:color-mix(in srgb,var(--acc) 14%,transparent)}
#tip{position:fixed;z-index:60;max-width:320px;pointer-events:none;background:var(--raised);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 18px 50px rgba(0,0,0,.55);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font-size:14px;font-weight:600}
#tip span{display:block;color:var(--dim2)}
#tip code{font:500 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc)}

.plan{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.act{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--ink2);padding:22px;transition:border-color .2s var(--ease),background .2s var(--ease)}
.act+.act{margin-top:14px}
.act.kept{border-color:color-mix(in srgb,var(--acc) 60%,transparent);background:color-mix(in srgb,var(--acc) 5%,var(--ink2))}
.act .no{font-size:38px;line-height:1;font-weight:600;letter-spacing:-.04em;color:var(--dim)}
.act.kept .no{color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:2px;padding:3px 8px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2);white-space:nowrap}
.chip.good{color:var(--bone);border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.chip.bad{color:var(--bone);border-color:color-mix(in srgb,var(--cut) 65%,transparent)}
.chip.watch{color:var(--bone);border-color:color-mix(in srgb,var(--watch) 60%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none;display:inline-block}
.act h3{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.01em;margin-top:10px;overflow-wrap:anywhere}
.act .move{font-size:clamp(19px,2vw,25px);letter-spacing:-.02em;font-weight:600;margin-top:4px;color:var(--bone)}
.act .why{color:var(--dim2);margin-top:8px;max-width:64ch}
.act dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.act dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.act dd{font-size:13.5px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 18px;border-radius:2px;border:1px solid var(--line2);font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.btn:hover{border-color:var(--line3)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.acc:hover{background:var(--acc-hover)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.act .btn{margin-top:18px}
.side{position:sticky;top:84px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);padding:22px}
.side .v{font-size:34px;letter-spacing:-.03em;font-weight:600;line-height:1.1;margin:6px 0 4px}
.side .btn{width:100%;margin-top:18px}
.side p{font-size:13px;color:var(--dim2)}
.side p+p{margin-top:8px}

.legend{display:flex;gap:18px;font-size:12.5px;color:var(--dim2);margin-bottom:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.key{width:14px;height:8px;border-radius:2px;display:inline-block}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;text-align:right;color:var(--dim);font-size:11.5px;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:14px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal;min-width:210px}
td.bars{width:30%;min-width:200px;text-align:left}
.name{display:flex;gap:9px;align-items:baseline;overflow-wrap:anywhere;line-height:1.35}
.name .dot{transform:translateY(-1px)}
.sub{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.bar{display:block;height:8px;border-radius:0 4px 4px 0;min-width:2px;background:var(--dim);opacity:.75}
.bar.s{background:var(--acc);opacity:1;margin-top:2px}
tr:hover .bar{filter:brightness(1.15)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--ink2);padding:22px;min-width:0}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card .hint{color:var(--dim);font-size:12.5px;margin:2px 0 14px}
svg text{font:400 11px Switzer,ui-sans-serif,system-ui,sans-serif;fill:var(--dim)}
svg text.lab{fill:var(--bone);font-size:12px}
.gap{padding:14px 0;border-top:1px solid var(--line)}
.gap:first-of-type{border-top:0}
.gap .row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;margin-bottom:6px;flex-wrap:wrap}
.gap .row span:last-child{color:var(--dim2)}

.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rel .t{display:flex;gap:8px;align-items:center;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);margin-bottom:8px}

.crea{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px}
.ad{border:1px solid var(--line);border-radius:6px;background:var(--ink2);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s var(--ease),transform .2s var(--ease)}
.ad:hover{border-color:var(--line2);transform:translateY(-2px)}
.ad .art{position:relative;height:112px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--tone) 24%,var(--surface)),var(--surface) 70%);display:flex;align-items:flex-end;justify-content:space-between;padding:14px}
.ad .art::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:14px 14px;mask-image:linear-gradient(200deg,#000,transparent 70%)}
.ad .art strong{font-size:34px;line-height:1;letter-spacing:-.04em;font-weight:600;position:relative;z-index:1}
.ad .art .chip{position:relative;z-index:1;background:var(--ink)}
.ad .in{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.ad h3{font-size:14px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.ad dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.ad dt{font-size:11.5px;color:var(--dim)}
.ad dd{font-size:15px;font-weight:600;letter-spacing:-.01em}
.ad .q{font-size:13px;color:var(--dim2);margin-top:auto}
.ad .q small{display:block;color:var(--dim);margin-top:4px}

.brief{border:1px solid var(--line);border-radius:6px;background:var(--ink2);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.brief+.brief{margin-top:16px}
.brief .l{padding:26px;border-right:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 9%,var(--ink2)),var(--ink2) 60%)}
.brief .r{padding:26px;min-width:0}
.brief .hook{font-size:clamp(22px,2.6vw,32px);line-height:1.14;letter-spacing:-.025em;font-weight:600;margin-top:14px;text-wrap:balance}
.brief h3{font-size:13px;color:var(--dim2);font-weight:500;margin-top:10px}
.beats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.beats li{border:1px solid var(--line2);border-radius:4px;padding:10px;font-size:12.5px;line-height:1.4;background:var(--surface);min-height:84px}
.beats li b{display:block;color:var(--acc);font-size:11px;letter-spacing:.1em;font-weight:500;margin-bottom:4px}
.copy{margin-top:14px;border-left:2px solid var(--acc);padding:2px 0 2px 14px;white-space:pre-wrap}
.brief dl{margin-top:16px;display:grid;gap:8px;font-size:13px}
.brief dt{color:var(--dim);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.brief dd{color:var(--dim2)}

footer{padding:34px 0 60px;color:var(--dim);font-size:12.5px}
footer .wrap{display:flex;gap:10px 26px;flex-wrap:wrap;align-items:center}
footer .ok{color:var(--dim2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.rise{opacity:0;transform:translateY(14px);animation:rise .6s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}html{scroll-behavior:auto}*{transition:none!important}}
@media (max-width:900px){.hero .wrap,.plan,.brief{grid-template-columns:minmax(0,1fr)}.brief .l{border-right:0;border-bottom:1px solid var(--line)}.side{position:static}}
@media (max-width:560px){.tabs{margin-left:0;width:100%}.tabs button{flex:1;padding:9px 6px}.act{grid-template-columns:minmax(0,1fr)}.act .no{font-size:24px;margin-bottom:8px}.act .btn{width:100%}}
@media print{.top,.btn,.tabs{display:none}.view{display:block!important}}
</style>
</head>

    axis.textContent = WORDS.roas;
    add(chart, axis);
    var card = add(el('div', 'card'), add(el('div', 'scroll'), chart));
    add(node.body, card);
    return node;
  }
  function creativeCards(order) {
    var list = data.creatives || [];
    if (!list.length) return null;
    var node = section(order, WORDS.ads);
    var grid = el('div', 'crea');
    list.forEach(function (ad) { add(grid, adCard(ad)); });
    add(node.body, grid);
    return node;
  }
  function adCard(ad) {
    var card = el('article', 'ad');
    var art = el('div', 'art');
    art.style.setProperty('--tone', {good: 'var(--acc)', bad: 'var(--cut)', watch: 'var(--watch)'}[ad.tone] || 'var(--dim)');
    add(art, add(el('strong'), isNumber(ad.roas) ? figure(show(ad.roas, 'ratio'), ad.name + ', ' + WORDS.roas, ad.source, 'attributed.roas') : document.createTextNode('-')));
    if (ad.verdict) add(art, chip(ad.verdict, ad.tone));
    var facts = el('dl');
    [[WORDS.spend, 'spend', 'money'], [WORDS.sales, 'sales', 'number'], [WORDS.cps, 'costPerSale', 'money'], [WORDS.freq, 'frequency', 'ratio'], [WORDS.ctr, 'ctr', 'percent'], [WORDS.platRoas, 'platformRoas', 'ratio']].forEach(function (item) {
      if (isNumber(ad[item[1]])) add(facts, fact(item[0], figure(show(ad[item[1]], item[2]), ad.name + ', ' + item[0], ad.source, item[1])));
    });
    var inner = add(el('div', 'in'), add(el('h3', 'name'), platformDot(ad.platform), add(el('span'), document.createTextNode(ad.short || ad.name), el('span', 'sub', [ad.platformName || ad.platform, ad.format].filter(Boolean).join(', ')))), facts);
    if (ad.reason) add(inner, add(el('p', 'q', ad.reason), el('small', '', ad.verdictBy || '')));
    return add(card, art, inner);
  }
  function briefs(order) {
    var list = data.briefs || [];
    if (!list.length) return null;
    var node = section(order, WORDS.next);
    list.forEach(function (brief, index) {
      var card = el('article', 'brief');
      var left = add(el('div', 'l'), chip((index + 1) + (brief.format ? ' · ' + brief.format : ''), 'neutral'), el('div', 'hook', brief.hook), el('h3', '', brief.title));
      var right = el('div', 'r');
      if ((brief.beats || []).length) {
        var beats = el('ol', 'beats');
        brief.beats.forEach(function (beat, place) { add(beats, add(el('li'), el('b', '', String(place + 1).padStart(2, '0')), document.createTextNode(beat))); });
        add(right, beats);
      }
      add(right, el('p', 'copy', brief.copy));
      var facts = el('dl');
      [[WORDS.isNew, brief.isNew], [WORDS.taken, brief.taken], [WORDS.judged, brief.judgedOn]].forEach(function (pair) { if (pair[1]) add(facts, fact(pair[0], document.createTextNode(pair[1]))); });
      var button = el('button', 'btn', WORDS.copyText);
      button.type = 'button';
      button.style.marginTop = '18px';
      button.addEventListener('click', function () { copy([brief.hook].concat(brief.beats || [], [brief.copy]).join('\n'), button, WORDS.copyText); });
      proofs.push({label: brief.title, text: brief.hook, tool: (sources[brief.source] || {}).tool || '', reads: (sources[brief.source] || {}).reads || '', field: ''});
      add(node.body, add(card, left, add(right, facts, button)));
    });
    return node;
  }

  function proofView() {
    var node = section(1, WORDS.proof, WORDS.proofLead);
    var table = el('table');
    var head = el('tr');
    [WORDS.figure, WORDS.shown, WORDS.tool, WORDS.reads, WORDS.where].forEach(function (name) { var cell = el('th', '', name); cell.scope = 'col'; cell.style.textAlign = 'left'; add(head, cell); });
    var body = el('tbody');
    proofs.forEach(function (proof) {
      var line = el('tr');
      [proof.label, proof.text, proof.tool, proof.reads, proof.field].forEach(function (text) { var cell = el('td', '', text); cell.style.textAlign = 'left'; cell.style.whiteSpace = 'normal'; add(line, cell); });
      add(body, line);
    });
    add(node.body, add(el('div', 'scroll'), add(table, add(el('thead'), head), body)));
    return node;
  }

  function view(id, builders) {
    var node = el('main', 'view');
    node.id = 'view-' + id;
    node.setAttribute('role', 'tabpanel');
    var order = 0;
    builders.forEach(function (build) {
      var part = build(order + 1);
      if (!part) return;
      if (part.tagName === 'SECTION') order += 1;
      add(node, part);
    });
    return node;
  }
  function tabs(views) {
    var list = el('div', 'tabs');
    list.setAttribute('role', 'tablist');
    function pick(id) {
      views.forEach(function (item) {
        item.node.classList.toggle('hidden', item.id !== id);
        item.button.setAttribute('aria-selected', String(item.id === id));
      });
      window.scrollTo(0, 0);
    }
    views.forEach(function (item) {
      item.button = el('button', '', item.name);
      item.button.type = 'button';
      item.button.setAttribute('role', 'tab');
      item.button.setAttribute('aria-controls', item.node.id);
      item.button.addEventListener('click', function () { pick(item.id); });
      add(list, item.button);
    });
    list.pick = pick;
    return list;
  }

  document.documentElement.lang = FR ? 'fr' : 'en';
  document.title = 'Metrikia, ' + data.account;
  var app = document.getElementById('app');
  var views = [
    {id: 'growth', name: WORDS.growth, node: view('growth', [hero, kpis, actions, reliability, trend, campaigns, platforms])},
    {id: 'creative', name: WORDS.creative, node: view('creative', [creativeHero, creativeMap, creativeCards, briefs])}
  ].filter(function (item) { return item.node.children.length; });
  views.push({id: 'proof', name: WORDS.proof, node: view('proof', [proofView])});
  var bar = add(el('nav', 'top'), el('div', 'wrap'));
  var list = tabs(views);
  add(bar.firstChild, add(el('span', 'mark', 'Metrikia'), el('i')), list);
  add(app, bar);
  views.forEach(function (item) { add(app, item.node); });
  var foot = el('div', 'wrap');
  add(foot, el('span', '', WORDS.readOn + ' ' + day(data.readOn)), data.checks ? el('span', 'ok', proofs.length + ' ' + WORDS.checks + ', ' + data.checks.crossChecks + ' ' + WORDS.cross) : chip(WORDS.unchecked, 'watch'));
  add(app, add(el('footer'), foot));
  list.pick(data.open === 'creative' && views.length > 2 ? 'creative' : views[0].id);
}());
</script>
</body>
</html>
